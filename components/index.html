const CATEGORIES = ["Compute", "Drivetrain", "Power", "Sensors", "Communication", "UI", "Sound", "Lighting", "Control", "Connectors", "Cables", "Passives", "Mechanical", "Hardware", "Consumables", "Tools"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kr = v => Math.round(v).toLocaleString("en-GB") + " kr";
let activeCat = null, activeSrc = null, sortKey = null, sortDir = 1;

function load(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }

const total = DATA.reduce((s, r) => s + (r.dkk ? +r.dkk : 0), 0);
document.getElementById("summary").textContent =
  `${DATA.length} parts · ≈ ${kr(total)} with known prices (excl. shipping) · source: inventory.csv`;

function renderChips() {
  const el = document.getElementById("chips");
  const all = [null, ...CATEGORIES];
  el.innerHTML = all.map(c => {
    const n = c ? DATA.filter(r => r.category === c).length : DATA.length;
    return `<button class="chip" data-c="${esc(c ?? "")}" aria-pressed="${c === activeCat}">${esc(c ?? "All")}<small>${n}</small></button>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    activeCat = b.dataset.c || null; save("cat", activeCat ?? ""); renderChips(); render();
  });
  const src = document.getElementById("srcchips");
  const sources = [null, ...new Set(DATA.map(r => r.source))];
  src.innerHTML = sources.map(s => {
    const n = s ? DATA.filter(r => r.source === s).length : DATA.length;
    return `<button class="chip" data-s="${esc(s ?? "")}" aria-pressed="${s === activeSrc}">${esc(s ?? "Any source")}<small>${n}</small></button>`;
  }).join("");
  src.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    activeSrc = b.dataset.s || null; renderChips(); render();
  });
}

function links(r) {
  const docs = r.datasheets.split(/\s+/).filter(Boolean).map(f => `<a href="datasheets/${esc(f)}" target="_blank">📄 ${esc(f.replace(/\.pdf$/, ""))}</a>`);
  const web = r.links.split(/\s+/).filter(Boolean).map(u => `<a href="${esc(u)}" target="_blank">${u.startsWith("http") ? "🔗 web" : "📝 notes"}</a>`);
  return docs.concat(web).join("");
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let rows = DATA.filter(r => (!activeCat || r.category === activeCat) && (!activeSrc || r.source === activeSrc) &&
    (!q || Object.values(r).join(" ").toLowerCase().includes(q)));
  if (sortKey) rows = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const nx = parseFloat(x), ny = parseFloat(y);
    return (isNaN(nx) || isNaN(ny) ? String(x).localeCompare(String(y), "en") : nx - ny) * sortDir;
  });
  document.getElementById("count").textContent = `${rows.length} shown`;
  document.getElementById("rows").innerHTML = rows.map(r => `<tr>
    <td><div class="name">${esc(r.name)}</div><code>${esc(r.id)}</code>${r.chip ? ` <span class="chipname">· ${esc(r.chip)}</span>` : ""}</td>
    <td class="cat">${esc(r.category)}</td>
    <td class="num">${esc(r.qty)}</td>
    <td class="cat">${esc(r.source)}</td>
    <td class="cat">${esc(r.condition)}</td>
    <td class="num">${r.dkk ? kr(+r.dkk) : "?"}</td>
    <td>${esc(r.store)}</td>
    <td>${esc(r.date)}</td>
    <td class="docs">${links(r)}</td>
    <td class="notes">${esc(r.notes)}</td></tr>`).join("");
}

document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render();
});
document.getElementById("q").oninput = render;
activeCat = load("cat", "") || null;
if (activeCat && !CATEGORIES.includes(activeCat)) activeCat = null;
renderChips(); render();
</script>
