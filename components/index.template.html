<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNEP V2 komponenter</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #fff; --ink: #1c1c1a; --muted: #6b6a64; --line: #e3e1da;
    --accent: #c4501b; --chip: #ecebe5; --row-hover: #faf9f6;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a998f; --line: #34332f;
      --accent: #ef7a44; --chip: #2b2a27; --row-hover: #262624; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; }
  header { padding: 28px 24px 12px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); }
  .controls { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 24px 12px;
    max-width: 1280px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  input[type=search] { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 0; background: var(--chip); color: var(--ink); padding: 5px 10px; border-radius: 999px;
    cursor: pointer; font: inherit; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--accent); color: #fff; }
  .chip small { opacity: .7; margin-left: 4px; }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 48px; }
  .count { color: var(--muted); margin: 8px 0; }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
    cursor: pointer; user-select: none; white-space: nowrap; }
  tr:hover td { background: var(--row-hover); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  code { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  .name { font-weight: 600; }
  .chipname { color: var(--muted); font-size: 12px; }
  .notes { color: var(--muted); font-size: 13px; max-width: 360px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .docs a { display: inline-block; margin-right: 8px; white-space: nowrap; }
  .cat { font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { header, .controls, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>SENNEP V2 — komponenter</h1>
  <div class="sub" id="summary"></div>
</header>
<div class="controls">
  <input type="search" id="q" placeholder="Søg: navn, chip, butik, note …  (fx “3,3 V”, “I²C”, “esp”)" autofocus>
  <div class="chips" id="chips"></div>
</div>
<main>
  <div class="count" id="count"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="navn">Komponent</th><th data-k="kategori">Kategori</th><th data-k="antal">Antal</th>
        <th data-k="dkk">≈ DKK</th><th data-k="butik">Butik</th><th data-k="dato">Dato</th>
        <th>Datablad / links</th><th>Noter</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const DATA = /*DATA*/[];
const CATEGORIES = /*CATEGORIES*/[];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kr = v => Math.round(v).toLocaleString("da-DK") + " kr";
let activeCat = null, sortKey = null, sortDir = 1;

function load(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }

const total = DATA.reduce((s, r) => s + (r.dkk ? +r.dkk : 0), 0);
document.getElementById("summary").textContent =
  `${DATA.length} komponenter · ≈ ${kr(total)} med kendte priser (ekskl. fragt) · kilde: inventory.csv`;

function renderChips() {
  const el = document.getElementById("chips");
  const all = [null, ...CATEGORIES];
  el.innerHTML = all.map(c => {
    const n = c ? DATA.filter(r => r.kategori === c).length : DATA.length;
    return `<button class="chip" data-c="${esc(c ?? "")}" aria-pressed="${c === activeCat}">${esc(c ?? "Alle")}<small>${n}</small></button>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    activeCat = b.dataset.c || null; save("cat", activeCat ?? ""); renderChips(); render();
  });
}

function links(r) {
  const docs = r.datablade.split(/\s+/).filter(Boolean).map(f => `<a href="datasheets/${esc(f)}" target="_blank">📄 ${esc(f.replace(/\.pdf$/, ""))}</a>`);
  const web = r.links.split(/\s+/).filter(Boolean).map(u => `<a href="${esc(u)}" target="_blank">${u.startsWith("http") ? "🔗 web" : "📝 noter"}</a>`);
  return docs.concat(web).join("");
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let rows = DATA.filter(r => (!activeCat || r.kategori === activeCat) &&
    (!q || Object.values(r).join(" ").toLowerCase().includes(q)));
  if (sortKey) rows = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const nx = parseFloat(x), ny = parseFloat(y);
    return (isNaN(nx) || isNaN(ny) ? String(x).localeCompare(String(y), "da") : nx - ny) * sortDir;
  });
  document.getElementById("count").textContent = `${rows.length} vist`;
  document.getElementById("rows").innerHTML = rows.map(r => `<tr>
    <td><div class="name">${esc(r.navn)}</div><code>${esc(r.id)}</code>${r.chip ? ` <span class="chipname">· ${esc(r.chip)}</span>` : ""}</td>
    <td class="cat">${esc(r.kategori)}</td>
    <td class="num">${esc(r.antal)}</td>
    <td class="num">${r.dkk ? kr(+r.dkk) : "?"}</td>
    <td>${esc(r.butik)}</td>
    <td>${esc(r.dato)}</td>
    <td class="docs">${links(r)}</td>
    <td class="notes">${esc(r.noter)}</td></tr>`).join("");
}

document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render();
});
document.getElementById("q").oninput = render;
activeCat = load("cat", "") || null;
if (activeCat && !CATEGORIES.includes(activeCat)) activeCat = null;
renderChips(); render();
</script>
</body>
</html>
