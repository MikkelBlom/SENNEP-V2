<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNEP Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f73; --line: #e2e2dc;
  --accent: #b5651d; --accent-ink: #ffffff; --chip: #efede6; --warn: #b3261e; --ok: #2e7d32; --hl: #fff4e0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151617; --panel: #1e2022; --ink: #e8e6e1; --muted: #9a9ea3; --line: #33363a;
    --accent: #e08a3c; --accent-ink: #151617; --chip: #2a2c2f; --warn: #ff8a80; --ok: #81c784; --hl: #3a2d1c;
  }
}
:root[data-theme="dark"] {
  --bg: #151617; --panel: #1e2022; --ink: #e8e6e1; --muted: #9a9ea3; --line: #33363a;
  --accent: #e08a3c; --accent-ink: #151617; --chip: #2a2c2f; --warn: #ff8a80; --ok: #81c784; --hl: #3a2d1c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header h1 span { color: var(--accent); }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
nav button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
#status { margin-left: auto; color: var(--muted); font-size: 12px; }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
button.btn { background: var(--accent); color: var(--accent-ink); border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
button.ghost { background: var(--chip); color: var(--ink); border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar input, .toolbar select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.hint { color: var(--muted); font-size: 12px; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); white-space: nowrap; cursor: pointer; }
td { border-bottom: 1px solid var(--line); padding: 2px 4px; vertical-align: top; }
tr:hover td { background: var(--hl); }
td input, td select, td textarea { width: 100%; border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; padding: 4px; border-radius: 4px; }
td textarea { resize: vertical; field-sizing: content; min-height: 28px; }
td input:focus, td select:focus, td textarea:focus { border-color: var(--accent); background: var(--panel); outline: none; }
td.del button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; }
td.del button:hover { color: var(--warn); }
td a { color: var(--accent); word-break: break-all; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.big { font-size: 26px; font-weight: 700; }
.card ul { margin: 6px 0 0; padding-left: 18px; }
.connect { max-width: 560px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
.connect h2 { margin-top: 0; }
.docs { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
.doclist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: calc(100vh - 140px); overflow: auto; }
.doclist .grp { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 10px 6px 4px; letter-spacing: .05em; }
.doclist a { display: block; padding: 3px 6px; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doclist a.on, .doclist a:hover { background: var(--chip); }
.docview { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 22px 22px; min-width: 0; }
.docview .md { overflow-x: auto; }
.docview .md table { width: auto; margin: 10px 0; }
.docview .md th, .docview .md td { border: 1px solid var(--line); padding: 4px 8px; position: static; cursor: auto; }
.docview .md img { max-width: 100%; }
.docview .md pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow-x: auto; }
.docview .md code { font-family: var(--mono); font-size: 12.5px; }
.docview textarea.editor { width: 100%; min-height: 70vh; font-family: var(--mono); font-size: 13px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--chip); font-size: 12px; }
.warn { color: var(--warn); }
.okc { color: var(--ok); }
@media (max-width: 760px) { .docs { grid-template-columns: 1fr; } .doclist { max-height: 240px; } }
</style>
</head>
<body>
<header>
  <h1>SENNEP <span>HUB</span></h1>
  <nav id="nav"></nav>
  <div id="status">not connected</div>
  <button class="ghost" id="themeBtn" title="Toggle theme">◐</button>
</header>
<main id="main"></main>

<script>
"use strict";
// ---------- Views: every table is a plain ;-separated CSV in the repo ----------
const STATUS_TASK = ["todo", "doing", "waiting", "blocked", "done"];
const VIEWS = [
  { key: "home", label: "Overview" },
  { key: "tasks", label: "Tasks", file: "hub/data/tasks.csv", idPrefix: "t",
    enums: { status: STATUS_TASK, who: ["Mikkel", "Claude", "both"], priority: ["high", "medium", "low"] },
    filters: ["status", "who", "area"], long: ["note", "title"], defaults: { status: "todo", priority: "medium" } },
  { key: "parts", label: "Parts", file: "components/inventory.csv", where: r => r.category !== "Tools",
    enums: { source: ["SENNEP V2", "SENNEP V1", "other project"], condition: ["ok", "used", "broken", "unknown"] },
    check: ["counted"], filters: ["category", "condition", "counted"], long: ["notes", "name"],
    hide: ["dkk", "chip", "datasheets", "links", "store", "date", "currency", "line_price"],
    defaults: { source: "SENNEP V2", condition: "unknown", category: "Mechanical" },
    hint: "Tick <b>counted</b> when you have physically checked qty + condition. After editing, ask Claude to run <code>components/build_inventory.py</code> to refresh INVENTORY.md." },
  { key: "tools", label: "Tools", file: "components/inventory.csv", where: r => r.category === "Tools",
    enums: { source: ["SENNEP V2", "SENNEP V1", "other project"], condition: ["ok", "used", "broken", "unknown"] },
    check: ["counted"], filters: ["condition", "counted"], long: ["notes", "name"],
    hide: ["dkk", "chip", "datasheets", "links", "store", "date", "currency", "line_price", "category"],
    defaults: { source: "other project", condition: "ok", category: "Tools" },
    hint: "Tools live in the same parts list (category Tools)." },
  { key: "shopping", label: "Shopping", file: "hub/data/shopping.csv", idPrefix: "s",
    enums: { tier: ["minimum", "recommended", "nice"], status: ["check first", "to ask", "to buy", "ordered", "have", "dropped"] },
    filters: ["tier", "status"], long: ["note", "item", "for"], defaults: { tier: "minimum", status: "to buy" } },
  { key: "cells", label: "Battery cells", file: "hub/data/battery_cells.csv",
    enums: { wrap_ok: ["", "yes", "no"], group: ["", "G1", "G2", "G3", "spare", "scrap"] }, long: ["note"],
    hint: "How to measure: docs/electronics/BATTERY_PLAN.md §6. Fluke: black in COM, red in V/Ω, dial on V⎓. Never the A or mA socket." },
  { key: "ideas", label: "Ideas", file: "hub/data/ideas.csv",
    enums: { status: ["someday", "next", "picked up", "dropped"] }, filters: ["status"], long: ["notes", "idea"], defaults: { status: "someday" } },
  { key: "links", label: "Links", file: "hub/data/links.csv", long: ["note"], url: ["url"], filters: ["category"] },
  { key: "docs", label: "Docs & notes" },
];

let root = null;              // FileSystemDirectoryHandle of the repo root
const store = {};             // path -> { fields, rows, mtime }
let current = "home";
const ui = {};                // per-view search/filter state

// ---------- CSV (semicolon, RFC-4180 quoting like Python's csv module) ----------
function parseCsv(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"' && f === "") q = true;
    else if (c === ";") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const fields = rows.shift() || [];
  return { fields, rows: rows.map(r => Object.fromEntries(fields.map((k, i) => [k, r[i] ?? ""]))) };
}
function cell(v) { v = String(v ?? ""); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCsv({ fields, rows }) { return [fields, ...rows.map(r => fields.map(k => r[k]))].map(r => r.map(cell).join(";")).join("\n") + "\n"; }

// ---------- File access ----------
async function handleFor(path, create = false) {
  const parts = path.split("/"); let dir = root;
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p, { create });
  return dir.getFileHandle(parts.at(-1), { create });
}
async function readText(path) { const f = await (await handleFor(path)).getFile(); return { text: await f.text(), mtime: f.lastModified }; }
async function writeFile(path, data) {
  const h = await handleFor(path, true); const w = await h.createWritable(); await w.write(data); await w.close();
  return (await h.getFile()).lastModified;
}
async function loadCsv(path, force) {
  if (store[path] && !force) return store[path];
  try { const { text, mtime } = await readText(path); store[path] = { ...parseCsv(text), mtime }; }
  catch { store[path] = { fields: [], rows: [], mtime: 0, missing: true }; }
  return store[path];
}
const timers = {};
function scheduleSave(path) { setStatus("unsaved…"); clearTimeout(timers[path]); timers[path] = setTimeout(() => saveCsv(path), 600); }
async function saveCsv(path) {
  timers[path] = null;
  const s = store[path];
  try {
    const disk = (await (await handleFor(path)).getFile()).lastModified;
    if (s.mtime && disk !== s.mtime &&
        !confirm(path + " changed on disk since it was loaded (git pull or Claude?).\nOK = overwrite with your version, Cancel = reload from disk.")) {
      await loadCsv(path, true); render(); setStatus("reloaded " + path); return;
    }
  } catch {}
  s.mtime = await writeFile(path, toCsv(s));
  setStatus("saved " + new Date().toLocaleTimeString());
}
function setStatus(t) { document.getElementById("status").textContent = t; }

// Remember the folder between visits (IndexedDB), so it is one click next time.
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("sennep-hub", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
async function kv(key, val) {
  try {
    const db = await idb(); const tx = db.transaction("kv", val === undefined ? "readonly" : "readwrite"); const os = tx.objectStore("kv");
    return await new Promise(res => { const r = val === undefined ? os.get(key) : os.put(val, key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
  } catch { return null; }
}
async function connect(handle) {
  if (!handle) handle = await window.showDirectoryPicker({ id: "sennep", mode: "readwrite" });
  if ((await handle.queryPermission({ mode: "readwrite" })) !== "granted" &&
      (await handle.requestPermission({ mode: "readwrite" })) !== "granted") return;
  try { await handle.getDirectoryHandle("hub"); await handle.getDirectoryHandle("components"); }
  catch { alert("Pick the repo root folder (the one containing hub/ and components/)."); return; }
  root = handle; kv("root", handle);
  setStatus("connected: " + handle.name);
  render();
}

// ---------- Rendering ----------
const $ = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "html") e.innerHTML = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
};
function renderNav() {
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  for (const v of VIEWS) nav.append($("button", { class: v.key === current ? "on" : "", onclick: () => { current = v.key; try { localStorage.hubTab = v.key; } catch {} render(); } }, v.label));
}
async function render() {
  renderNav();
  const main = document.getElementById("main"); main.innerHTML = "";
  if (!root) return main.append(await connectScreen());
  const v = VIEWS.find(x => x.key === current);
  if (v.key === "home") return main.append(await homeView());
  if (v.key === "docs") return main.append(await docsView());
  main.append(await tableView(v));
}
async function connectScreen() {
  const box = $("div", { class: "connect" },
    $("h2", {}, "Open the SENNEP folder"),
    $("p", {}, "The hub reads and writes plain files in your local clone of the repo (CSV + Markdown). Pick the ", $("b", {}, "repo root"), " folder: the one with hub/, components/ and docs/."),
    $("p", { class: "hint" }, "Needs Chrome or Edge (folder access). Nothing leaves your PC. Commit and push with git as usual."));
  if (!window.showDirectoryPicker) { box.append($("p", { class: "warn" }, "This browser has no folder access. Open this file in Chrome or Edge.")); return box; }
  const saved = await kv("root");
  if (saved) box.append($("button", { class: "btn", onclick: () => connect(saved) }, "Reconnect to “" + saved.name + "”"), " ");
  box.append($("button", { class: saved ? "ghost" : "btn", onclick: () => connect() }, "Choose folder…"));
  return box;
}

async function tableView(v) {
  const data = await loadCsv(v.file);
  const st = ui[v.key] ||= { q: "", f: {}, sort: null };
  const wrap = $("div");
  if (data.missing) { wrap.append($("p", { class: "warn" }, v.file + " not found.")); return wrap; }
  const fields = data.fields.filter(f => !(v.hide || []).includes(f));
  const values = k => [...new Set(data.rows.filter(v.where || (() => true)).map(r => r[k]))].sort();

  const bar = $("div", { class: "toolbar" });
  const search = $("input", { placeholder: "Search…", value: st.q, oninput: e => { st.q = e.target.value; drawBody(); } });
  bar.append(search);
  for (const k of v.filters || []) {
    const sel = $("select", { onchange: e => { st.f[k] = e.target.value; drawBody(); } }, $("option", { value: "" }, "all " + k));
    for (const val of (v.check || []).includes(k) ? ["✓", "not counted"] : values(k)) sel.append($("option", { value: val, selected: st.f[k] === val }, val || "(empty)"));
    bar.append(sel);
  }
  bar.append($("button", { class: "btn", onclick: addRow }, "+ Add row"));
  const count = $("span", { class: "hint" });
  bar.append(count);
  wrap.append(bar);
  if (v.hint) wrap.append($("p", { class: "hint", html: v.hint }));
  if (v.key === "cells") wrap.append(cellStats(data));

  const table = $("table");
  const head = $("tr", {}, fields.map(k => $("th", { onclick: () => { st.sort = st.sort === k ? "-" + k : k; drawBody(); } }, k)), $("th"));
  table.append($("thead", {}, head));
  const tbody = $("tbody"); table.append(tbody);
  wrap.append($("div", { class: "tablewrap" }, table));

  function visible() {
    let rows = data.rows.filter(v.where || (() => true));
    const q = st.q.toLowerCase();
    if (q) rows = rows.filter(r => fields.some(k => String(r[k]).toLowerCase().includes(q)));
    for (const [k, val] of Object.entries(st.f)) if (val) rows = rows.filter(r => (v.check || []).includes(k) ? (val === "✓") === !!r[k] : r[k] === val);
    if (st.sort) { const d = st.sort[0] === "-" ? -1 : 1, k = st.sort.replace(/^-/, ""); rows = [...rows].sort((a, b) => d * String(a[k]).localeCompare(String(b[k]), undefined, { numeric: true })); }
    return rows;
  }
  function editor(r, k) {
    const set = val => { r[k] = val; scheduleSave(v.file); if (v.key === "cells") wrap.replaceChild(cellStats(data), wrap.querySelector(".cards")); };
    if ((v.check || []).includes(k)) return $("input", { type: "checkbox", checked: !!r[k], style: "width:auto", onchange: e => set(e.target.checked ? "✓" : "") });
    const en = v.enums?.[k];
    if (en) {
      const s = $("select", { onchange: e => set(e.target.value) });
      for (const o of en.includes(r[k]) ? en : [...en, r[k]]) s.append($("option", { value: o, selected: o === r[k] }, o));
      return s;
    }
    if ((v.long || []).includes(k)) return $("textarea", { rows: 1, oninput: e => set(e.target.value) }, r[k]);
    const inp = $("input", { value: r[k], oninput: e => set(e.target.value), size: Math.max(4, Math.min(24, String(r[k]).length + 1)) });
    if ((v.url || []).includes(k) && r[k]) return $("div", {}, inp, $("a", { href: r[k], target: "_blank", rel: "noopener" }, "open ↗"));
    return inp;
  }
  function drawBody() {
    tbody.innerHTML = "";
    const rows = visible();
    count.textContent = rows.length + " rows";
    for (const r of rows) tbody.append($("tr", {}, fields.map(k => $("td", {}, editor(r, k))),
      $("td", { class: "del" }, $("button", { title: "Delete row", onclick: () => { if (confirm("Delete this row?")) { data.rows.splice(data.rows.indexOf(r), 1); scheduleSave(v.file); drawBody(); } } }, "×"))));
  }
  function addRow() {
    const r = Object.fromEntries(data.fields.map(k => [k, ""]));
    Object.assign(r, v.defaults || {});
    if (data.fields.includes("id")) {
      if (v.idPrefix) { const n = Math.max(0, ...data.rows.map(x => parseInt(String(x.id).slice(v.idPrefix.length)) || 0)) + 1; r.id = v.idPrefix + String(n).padStart(2, "0"); }
      else r.id = "new-" + Date.now().toString(36);
    }
    if (v.key === "cells") r.cell = String(data.rows.length + 1);
    data.rows.push(r); st.q = ""; st.f = {}; search.value = ""; scheduleSave(v.file); drawBody();
    tbody.lastElementChild?.querySelector("input,textarea")?.focus();
  }
  drawBody();
  return wrap;
}

function cellStats(data) {
  const vs = data.rows.map(r => parseFloat(String(r.voltage_v).replace(",", "."))).filter(x => !isNaN(x));
  const box = $("div", { class: "cards" });
  const card = (t, body) => box.append($("div", { class: "card" }, $("h3", {}, t), body));
  card("Measured", $("div", { class: "big" }, vs.length + " / " + data.rows.length));
  if (vs.length) {
    const min = Math.min(...vs), max = Math.max(...vs), spread = max - min;
    card("Range", $("div", { class: "big" }, min.toFixed(3) + "–" + max.toFixed(3) + " V"));
    card("Spread", $("div", { class: "big " + (spread <= 0.05 ? "okc" : "warn") }, spread.toFixed(3) + " V"));
    const low = vs.filter(x => x < 2.5).length;
    card("Below 2.5 V", $("div", { class: "big " + (low ? "warn" : "okc") }, String(low)));
  }
  return box;
}

async function homeView() {
  const tasks = await loadCsv("hub/data/tasks.csv"), inv = await loadCsv("components/inventory.csv");
  const shop = await loadCsv("hub/data/shopping.csv"), cells = await loadCsv("hub/data/battery_cells.csv");
  const open = tasks.rows.filter(t => t.status !== "done");
  const box = $("div");
  const cards = $("div", { class: "cards" }); box.append(cards);
  const card = (t, ...body) => cards.append($("div", { class: "card" }, $("h3", {}, t), ...body));
  card("Open tasks", $("div", { class: "big" }, String(open.length)), $("div", { class: "hint" }, STATUS_TASK.slice(0, 4).map(s => s + " " + open.filter(t => t.status === s).length).join(" · ")));
  card("Parts counted", $("div", { class: "big" }, inv.rows.filter(r => r.counted).length + " / " + inv.rows.length));
  card("Cells measured", $("div", { class: "big" }, cells.rows.filter(r => r.voltage_v).length + " / " + cells.rows.length));
  const minTotal = shop.rows.filter(r => r.tier === "minimum" && !["have", "dropped"].includes(r.status)).reduce((a, r) => a + (parseFloat(r.est_dkk) || 0), 0);
  card("Shopping (minimum left)", $("div", { class: "big" }, "≈ " + Math.round(minTotal) + " kr"));
  const list = (title, rows) => {
    const ul = $("ul"); for (const t of rows) ul.append($("li", {}, $("span", { class: "pill" }, t.area), " ", t.title, t.status !== "todo" ? $("span", { class: "hint" }, " (" + t.status + ")") : null));
    return $("div", { class: "card" }, $("h3", {}, title), rows.length ? ul : $("p", { class: "hint" }, "Nothing here."));
  };
  const rank = { high: 0, medium: 1, low: 2 };
  const by = who => open.filter(t => t.who === who || t.who === "both").sort((a, b) => (rank[a.priority] ?? 3) - (rank[b.priority] ?? 3));
  box.append($("div", { class: "cards" }, list("Mikkel — next up", by("Mikkel").slice(0, 10)), list("Claude — next up", by("Claude").slice(0, 10))));
  return box;
}

// ---------- Docs & notes ----------
const DOC_DIRS = ["hub/notes", "docs", "ai-instructions", "components", "lidar", "firmware", "protocol", "print"];
const SKIP = new Set([".git", "target", "node_modules", "datasheets", "archive_skip"]);
let docState = { path: null, edit: false };
async function walk(dir, prefix, out, depth = 0) {
  for await (const [name, h] of dir.entries()) {
    if (SKIP.has(name)) continue;
    const p = prefix + "/" + name;
    if (h.kind === "directory" && depth < 3) await walk(h, p, out, depth + 1);
    else if (h.kind === "file" && /\.(md|txt)$/i.test(name)) out.push(p);
  }
}
async function docsView() {
  const files = [];
  for (const d of DOC_DIRS) { try { await walk(await root.getDirectoryHandle(d), d, files); } catch {} }
  try { await root.getFileHandle("CLAUDE.md"); files.unshift("CLAUDE.md"); } catch {}
  const wrap = $("div");
  const bar = $("div", { class: "toolbar" },
    $("button", { class: "btn", onclick: newNote }, "+ New note"),
    $("label", { class: "ghost", style: "cursor:pointer" }, "Attach files", $("input", { type: "file", multiple: true, style: "display:none", onchange: e => attach(e.target.files) })),
    $("span", { class: "hint" }, "Notes live in hub/notes/, attachments (diagrams, photos, PDFs) in hub/files/."));
  wrap.append(bar);
  const list = $("div", { class: "doclist" });
  let grp = null;
  for (const f of files.sort((a, b) => a.localeCompare(b))) {
    const g = f.includes("/") ? f.split("/").slice(0, -1).join("/") : "root";
    if (g !== grp) { list.append($("div", { class: "grp" }, g)); grp = g; }
    list.append($("a", { href: "#", class: f === docState.path ? "on" : "", title: f, onclick: e => { e.preventDefault(); docState = { path: f, edit: false }; render(); } }, f.split("/").at(-1)));
  }
  try {
    const fdir = await root.getDirectoryHandle("hub").then(h => h.getDirectoryHandle("files"));
    const names = []; for await (const [n, h] of fdir.entries()) if (h.kind === "file" && n !== ".gitkeep") names.push(n);
    if (names.length) { list.append($("div", { class: "grp" }, "hub/files")); for (const n of names.sort()) list.append($("a", { href: "#", onclick: e => { e.preventDefault(); openBlob("hub/files/" + n); } }, n + " ↗")); }
  } catch {}
  const view = $("div", { class: "docview" });
  wrap.append($("div", { class: "docs" }, list, view));
  if (!docState.path) docState.path = files.includes("hub/notes/README.md") ? "hub/notes/README.md" : files[0];
  if (docState.path) await showDoc(view);
  return wrap;
}
async function showDoc(view) {
  const path = docState.path;
  const { text, mtime } = await readText(path);
  const bar = $("div", { class: "toolbar", style: "margin-top:12px" }, $("b", {}, path));
  view.append(bar);
  if (docState.edit) {
    const ta = $("textarea", { class: "editor" }, text);
    const save = async () => {
      const disk = (await (await handleFor(path)).getFile()).lastModified;
      if (disk !== mtime && !confirm("File changed on disk since you opened it. Overwrite?")) return;
      await writeFile(path, ta.value); setStatus("saved " + path); docState.edit = false; render();
    };
    ta.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
    bar.append($("button", { class: "btn", onclick: save }, "Save (Ctrl+S)"), $("button", { class: "ghost", onclick: () => { docState.edit = false; render(); } }, "Cancel"));
    view.append(ta); ta.focus();
    return;
  }
  bar.append($("button", { class: "ghost", onclick: () => { docState.edit = true; render(); } }, "Edit"));
  const md = $("div", { class: "md" });
  if (window.marked && path.endsWith(".md")) md.innerHTML = marked.parse(text);
  else md.append($("pre", { style: "white-space:pre-wrap" }, text));
  view.append(md);
  const base = path.split("/").slice(0, -1);
  const resolve = rel => { const out = [...base]; for (const p of rel.split("/")) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); } return out.join("/"); };
  for (const img of md.querySelectorAll("img")) {
    const src = img.getAttribute("src"); if (!src || /^(https?:|data:)/.test(src)) continue;
    try { img.src = URL.createObjectURL(await (await handleFor(decodeURI(resolve(src)))).getFile()); } catch {}
  }
  for (const a of md.querySelectorAll("a")) {
    const href = a.getAttribute("href"); if (!href || /^(https?:|mailto:|#)/.test(href)) { a.target = "_blank"; continue; }
    const target = resolve(decodeURI(href.split("#")[0]));
    a.addEventListener("click", e => { e.preventDefault(); if (/\.md$/i.test(target)) { docState = { path: target, edit: false }; render(); } else openBlob(target); });
  }
}
async function openBlob(path) {
  try { window.open(URL.createObjectURL(await (await handleFor(path)).getFile()), "_blank"); } catch { alert("Not found: " + path); }
}
async function newNote() {
  const title = prompt("Note title (e.g. 'Wiring ideas for the lights')"); if (!title) return;
  const slug = title.toLowerCase().replace(/[^a-z0-9æøå]+/g, "-").replace(/^-|-$/g, "");
  const path = "hub/notes/" + slug + ".md";
  try { await handleFor(path); alert("A note with that name exists."); return; } catch {}
  await writeFile(path, "# " + title + "\n\n" + new Date().toISOString().slice(0, 10) + "\n\n");
  docState = { path, edit: true }; render();
}
async function attach(fileList) {
  for (const f of fileList) await writeFile("hub/files/" + f.name.replace(/[\\/]/g, "_"), f);
  setStatus("attached " + fileList.length + " file(s) to hub/files/");
  render();
}

// ---------- Boot ----------
document.getElementById("themeBtn").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.hubTheme = r.dataset.theme; } catch {}
};
try { if (localStorage.hubTheme) document.documentElement.dataset.theme = localStorage.hubTheme; if (localStorage.hubTab) current = localStorage.hubTab; } catch {}
window.addEventListener("focus", async () => {   // pick up changes from git pull / Claude when you come back to the tab
  if (!root || Object.values(timers).some(Boolean)) return;
  let changed = false;
  for (const [p, s] of Object.entries(store)) { try { const m = (await (await handleFor(p)).getFile()).lastModified; if (m !== s.mtime) { delete store[p]; changed = true; } } catch {} }
  if (changed) { setStatus("reloaded changed files"); render(); }
});
render();
</script>
